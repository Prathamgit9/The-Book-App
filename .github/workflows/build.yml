name: Android Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build debug APK
        run: gradle assembleDebug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: The-Book-App-debug
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: One-time v0.2.0 asset rename
        if: startsWith(github.event.head_commit.message, 'Release v0.2.0 asset')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk The-Book-App-v0.2.0.apk
          gh release upload v0.2.0 The-Book-App-v0.2.0.apk --clobber
          gh release delete-asset v0.2.0 app-debug.apk --yes || true
