name: Android Build
on:
  push:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: v0.2.0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle assembleDebug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: the-book-app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish GitHub Release
        if: startsWith(github.event.head_commit.message, 'Release v0.2.0')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" app/build/outputs/apk/debug/app-debug.apk --clobber
          else
            gh release create "$RELEASE_TAG" app/build/outputs/apk/debug/app-debug.apk               --title "The Book App $RELEASE_TAG"               --notes-file CHANGELOG.md               --verify-tag
          fi
