name: The Book App Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to build (for repairing an existing release, e.g. v0.2.1)"
        required: true
        default: "v0.2.1"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && 'main' || github.ref }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Require release signing
        shell: bash
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "ANDROID_KEYSTORE_BASE64 is not configured."; exit 1; }
          test -n "$KEYSTORE_PASSWORD" || { echo "ANDROID_KEYSTORE_PASSWORD is not configured."; exit 1; }
          test -n "$KEY_ALIAS" || { echo "ANDROID_KEY_ALIAS is not configured."; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "ANDROID_KEY_PASSWORD is not configured."; exit 1; }

      - name: Validate release version
        shell: bash
        run: |
          VERSION_NAME=$(grep -E 'versionName=' app/build.gradle.kts | sed -E 's/.*versionName="([^"]+)".*/\1/')
          EXPECTED=$(echo "$RELEASE_TAG" | sed 's/^v//')
          if [ "$VERSION_NAME" != "$EXPECTED" ]; then
            echo "versionName=$VERSION_NAME does not match release tag $RELEASE_TAG"
            exit 1
          fi

      - name: Configure release signing
        shell: bash
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > release-keystore.jks
          cat > keystore.properties <<EOF
          storeFile=../release-keystore.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Build signed release APK
        run: gradle assembleRelease

      - name: Prepare named APK
        shell: bash
        run: cp app/build/outputs/apk/release/app-release.apk "The-Book-App-$RELEASE_TAG.apk"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "The-Book-App-$RELEASE_TAG.apk" --clobber
          else
            gh release create "$RELEASE_TAG" "The-Book-App-$RELEASE_TAG.apk" \
              --title "The Book App $RELEASE_TAG" \
              --notes-file CHANGELOG.md \
              --verify-tag
          fi

      - name: Remove signing material
        if: always()
        run: rm -f release-keystore.jks keystore.properties
